name: Build

env:
  BUILD_TYPE: Release
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
        submodules: true
    
    - name: Setup CCache in PATH
      run: |
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        echo "CCACHE_DIR=/tmp/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV

    - name: CCache 
      uses: hendrikmuhs/ccache-action@main
      with:
        key: ${{ runner.os }}-ndk-${{ env.BUILD_TYPE }}
        max-size: 3G

    - name: Configure CMake and Build
      run: |
        cd ./3rdparty/glslang
        python ./update_glslang_source.py
        cd ../..

        for ANDROID_ABI in arm64-v8a armeabi-v7a x86 x86_64; do
          mkdir -p build_$ANDROID_ABI
          cd build_$ANDROID_ABI
          cmake $GITHUB_WORKSPACE -DANDROID_PLATFORM=26 -DANDROID_ABI=$ANDROID_ABI -DCMAKE_ANDROID_STL_TYPE=c++_static -DCMAKE_SYSTEM_NAME=Android -DANDROID_TOOLCHAIN=clang -DCMAKE_MAKE_PROGRAM=$ANDROID_NDK_LATEST_HOME/prebuilt/linux-x86_64/bin/make -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DThreads_FOUND=ON -DCMAKE_THREAD_LIBS_INIT="-pthread" -DCMAKE_USE_PTHREADS_INIT=ON
          cmake --build . --config Release --parallel 6
          cd ..
        done

        shopt -s globstar
        $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip $GITHUB_WORKSPACE/**/libMobileGL.so
      env:
        CC: ccache clang
        CXX: ccache clang++
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache

    - name: Upload Build Output
      uses: actions/upload-artifact@main
      with:
        name: MobileGL
        path: |
              **/libMobileGL.so